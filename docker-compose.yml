name: drain-rehearsal

services:
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    image: drain-rehearsal-simulator
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 9s
      timeout: 5s
      retries: 12

  drain:
    build:
      context: .
      dockerfile: Dockerfile
    image: drain-rehearsal-app
    restart: unless-stopped
    depends_on:
      simulator:
        condition: service_healthy
    environment:
      DRAIN_KUBE_MODE: host
      DRAIN_KUBE_HOST: http://simulator:8080
      DRAIN_KUBE_INSECURE: "1"
      DRAIN_SIM_URL: http://localhost:8080
      DRAIN_TITLE: 节点排空值班台（演练）
      # Rounds survive a `docker compose restart drain`.  The handover of a
      # node from one round to the next is only reported after this file has
      # been written.
      DRAIN_STATE_FILE: /data/rounds.json
    volumes:
      - drain-state:/data
    ports:
      - "8000:8000"

volumes:
  drain-state:
